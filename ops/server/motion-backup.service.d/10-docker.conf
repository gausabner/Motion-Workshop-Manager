# The backup unit, adjusted for the containerised deployment.
#
# ops/backup/motion-backup.service is written for an installed site, where
# MOTION runs from disk as the `motion` user and its attachments live in
# /var/lib/motion. Here the database and attachments are both inside Docker,
# which changes two things.
#
#   install -m 644 -D ops/server/motion-backup.service.d/10-docker.conf \
#       /etc/systemd/system/motion-backup.service.d/10-docker.conf

[Service]
# Root, because the dump reaches PostgreSQL through `docker exec` — the
# container publishes no port — and that needs the docker socket. The
# attachments are a docker volume under /var/lib/docker for the same reason.
User=root
Group=root
Environment=MOTION_BACKUP_ENV=/etc/motion/backup.env

# The empty assignment resets the list inherited from the shipped unit. Without
# it systemd keeps /var/lib/motion, which does not exist in this deployment,
# and refuses to start the unit at all:
#
#   Failed to set up mount namespacing: /run/systemd/unit-root/var/lib/motion:
#   No such file or directory
#
# A sandbox path that is missing is a hard failure, not a warning — so a backup
# that was enabled and looked healthy would simply never have run.
ReadWritePaths=
ProtectSystem=full
ReadWritePaths=/var/run/docker.sock
ReadWritePaths=/var/lib/docker
