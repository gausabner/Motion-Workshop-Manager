name: End-to-End Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: motion_app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/motion_app?schema=public
      SESSION_SECRET: ci-only-secret-not-for-production-0123456789
      # Each spec builds its own workshop, so the suite needs no seed data.
      E2E_PORT: 3011
      # The public pages read these from the environment, and with none set the
      # support page correctly renders "no support channels are configured".
      # Setting them here means CI exercises the configured page rather than
      # the warning — and a deployment that forgets them now fails visibly
      # instead of shipping a support page with nobody to contact.
      MOTION_EDITION: cloud
      MOTION_SUPPORT_WHATSAPP: "+264815765935"
      MOTION_SUPPORT_PHONE: "+264815765935"
      MOTION_SUPPORT_EMAIL: "gausabner@gmail.com"
      MOTION_SUPPORT_HOURS: "Monday to Friday, 08:00-17:00 (Africa/Windhoek)"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx prisma migrate deploy
      # Two engines, because the suite has two. Chromium covers desktop and
      # stands in for Android; the iphone project runs on WebKit, which is what
      # every iPhone runs and where this application's mobile problems have
      # actually lived. Installing only chromium meant the iphone project
      # failed to launch a browser at all rather than failing a test.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Run the end-to-end tests
        # Playwright builds and starts the app itself; see playwright.config.ts.
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
