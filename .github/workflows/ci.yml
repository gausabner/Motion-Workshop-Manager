name: MOTION Monorepo CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: "pip"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Lint with flake8 and black
      run: |
        black --check .
        flake8 .
    - name: Type check with mypy
      run: |
        mypy .
    - name: Test with pytest
      run: |
        pytest

  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "18"
        cache: "npm"
        cache-dependency-path: ./web/package-lock.json
    - name: Install dependencies
      run: npm ci
    - name: Run linter
      run: npm run lint
    - name: Run build
      run: npm run build

  security-sast:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run Bandit (Python Security)
      uses: shundor/python-bandit-gh-action@v2
      with:
        path: "api/"
        level: high
        confidence: high
    - name: Run npm audit
      run: cd web && npm audit --audit-level=high
