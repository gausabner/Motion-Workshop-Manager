apiVersion: apps/v1
kind: Deployment
metadata:
  name: motion-api
  namespace: motion-production
  labels:
    app: motion-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: motion-api
  template:
    metadata:
      labels:
        app: motion-api
    spec:
      containers:
      - name: api
        image: motion/api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: motion-db-credentials
              key: url
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: motion-api-service
  namespace: motion-production
spec:
  selector:
    app: motion-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP
